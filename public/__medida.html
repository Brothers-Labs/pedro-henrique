<!doctype html>
<meta charset="utf-8" />
<title>medida</title>
<style>
  body { font: 16px/1.4 monospace; margin: 0; padding: 8px; }
  iframe { border: 2px solid red; display: block; height: 640px; }
  #saida { padding: 8px; font-size: 20px; white-space: pre; }
</style>
<div id="saida">medindo...</div>
<iframe id="alvo" width="390"></iframe>
<script>
  const params = new URLSearchParams(location.search);
  const largura = Number(params.get('largura') || '390');
  const rota = params.get('rota') || '/mascote';
  const alvo = document.getElementById('alvo');

  alvo.width = largura;
  alvo.src = rota;

  alvo.addEventListener('load', () => {
    setTimeout(() => {
      const doc = alvo.contentDocument;
      const html = doc.documentElement;
      const largos = Array.from(doc.querySelectorAll('*')).filter(
        (el) => el.getBoundingClientRect().right > largura + 1,
      );

      document.getElementById('saida').textContent =
        `viewport=${largura} scrollWidth=${html.scrollWidth} clientWidth=${html.clientWidth}\n` +
        `estouram=${largos.length}\n` +
        largos.slice(0, 6).map((el) => `  ${el.tagName}.${el.className} right=${Math.round(el.getBoundingClientRect().right)}`).join('\n');
    }, 2500);
  });
</script>
