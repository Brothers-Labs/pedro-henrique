name: Verify

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    # A suíte e2e roda com WebGL por software (SwiftShader) e passa de 15 min com o
    # npm ci e a instalação do Chromium; 30 min dão folga para o retry de um teste.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run verify
      - name: Preserve coverage and browser reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-reports
          path: |
            coverage/
            playwright-report/
            test-results/
          if-no-files-found: ignore
