@let look = traits();

<svg viewBox="0 0 120 120" class="art" aria-hidden="true" focusable="false">
  @if (look.hasAura) {
    <circle class="art__aura" cx="60" cy="62" r="54" />
    <path class="art__sparkle" d="M16 28 l3 7 l7 3 l-7 3 l-3 7 l-3 -7 l-7 -3 l7 -3 z" />
    <path class="art__sparkle" d="M104 34 l2.5 6 l6 2.5 l-6 2.5 l-2.5 6 l-2.5 -6 l-6 -2.5 l6 -2.5 z" />
    <path class="art__sparkle" d="M102 94 l2 5 l5 2 l-5 2 l-2 5 l-2 -5 l-5 -2 l5 -2 z" />
  }

  <ellipse class="art__shadow" cx="60" cy="112" rx="24" ry="5" />

  <g [attr.transform]="scaleTransform()">
    @if (look.wings === 'pequenas') {
      <path class="art__soft" d="M38 68 C28 58 20 60 20 68 C20 75 28 79 38 78 Z" />
      <path class="art__soft" d="M82 68 C92 58 100 60 100 68 C100 75 92 79 82 78 Z" />
    } @else if (look.wings === 'grandes') {
      <path class="art__soft" d="M38 62 C24 40 6 42 8 58 C10 74 24 78 38 72 Z" />
      <path class="art__line" d="M20 48 L28 70" stroke-width="2.5" />
      <path class="art__soft" d="M82 62 C96 40 114 42 112 58 C110 74 96 78 82 72 Z" />
      <path class="art__line" d="M100 48 L92 70" stroke-width="2.5" />
    }

    <!-- Cauda: contorno escuro por baixo, corpo colorido por cima. -->
    <path class="art__limb-outline" [attr.d]="look.tail" stroke-width="14" />
    <path class="art__limb" [attr.d]="look.tail" stroke-width="8" />
    <path class="art__shape" [attr.d]="look.tailTip" />

    <ellipse class="art__shape" cx="44" cy="101" rx="11" ry="7" />
    <ellipse class="art__shape" cx="76" cy="101" rx="11" ry="7" />

    <ellipse class="art__shape" cx="60" [attr.cy]="look.bodyY" rx="25" ry="21" />
    <ellipse class="art__soft" cx="60" [attr.cy]="look.bodyY + 6" rx="15" ry="13" />

    @if (look.horns === 'pequenos') {
      <path class="art__shape" d="M47 27 l-4 -9 l10 5 z" />
      <path class="art__shape" d="M73 27 l4 -9 l-10 5 z" />
    } @else if (look.horns === 'grandes') {
      <path class="art__shape" d="M45 27 l-8 -16 l16 9 z" />
      <path class="art__shape" d="M75 27 l8 -16 l-16 9 z" />
    }

    <!-- Crista: é ela que faz o filhote já parecer um dragão, e não um bichinho. -->
    <path class="art__soft" [attr.d]="look.crest" />

    <circle class="art__shape" cx="60" cy="46" [attr.r]="look.headRadius" />

    <ellipse class="art__soft" cx="60" cy="59" rx="16" ry="10" />
    <circle class="art__pupil" cx="54" cy="56" r="1.8" />
    <circle class="art__pupil" cx="66" cy="56" r="1.8" />
    <path class="art__line" d="M52 62 Q60 67 68 62" stroke-width="2.5" />

    <circle class="art__eye-white" cx="51" cy="41" r="6.5" />
    <circle class="art__pupil" cx="52" cy="42" r="3.2" />
    <circle class="art__glint" cx="49.8" cy="39.2" r="1.7" />

    <circle class="art__eye-white" cx="69" cy="41" r="6.5" />
    <circle class="art__pupil" cx="70" cy="42" r="3.2" />
    <circle class="art__glint" cx="67.8" cy="39.2" r="1.7" />
  </g>
</svg>
