@let look = traits();

<svg viewBox="0 0 120 120" class="art" aria-hidden="true" focusable="false">
  @if (look.hasAura) {
    <circle class="art__aura" cx="60" cy="62" r="54" />
    <path class="art__sparkle" d="M102 32 l3 7 l7 3 l-7 3 l-3 7 l-3 -7 l-7 -3 l7 -3 z" />
    <path class="art__sparkle" d="M14 84 l2.5 6 l6 2.5 l-6 2.5 l-2.5 6 l-2.5 -6 l-6 -2.5 l6 -2.5 z" />
  }

  <ellipse class="art__shadow" cx="60" cy="112" rx="26" ry="5" />

  <g [attr.transform]="scaleTransform()">
    <path class="art__limb-outline" [attr.d]="look.tail" stroke-width="16" />
    <path class="art__limb" [attr.d]="look.tail" stroke-width="10" />

    @if (look.hasPlates) {
      <path [attr.class]="look.plateClass" d="M36 70 l-6 -9 l10 -1 z" />
      <path [attr.class]="look.plateClass" d="M84 70 l6 -9 l-10 -1 z" />
    }

    <ellipse class="art__shape" cx="45" cy="101" rx="11" ry="7" />
    <ellipse class="art__shape" cx="75" cy="101" rx="11" ry="7" />

    <ellipse class="art__shape" cx="60" cy="82" [attr.rx]="look.bodyRx" ry="21" />
    <ellipse class="art__soft" cx="60" cy="88" rx="15" ry="12" />

    @if (look.hasArms) {
      <path class="art__limb-outline" d="M39 76 q-7 3 -6 9" stroke-width="11" />
      <path class="art__limb" d="M39 76 q-7 3 -6 9" stroke-width="6" />
      <path class="art__limb-outline" d="M81 76 q7 3 6 9" stroke-width="11" />
      <path class="art__limb" d="M81 76 q7 3 6 9" stroke-width="6" />
    }

    <!-- Placas das costas: a marca do dinossauro, e o que mais cresce nele. -->
    @if (look.hasPlates) {
      <path [attr.class]="look.plateClass" d="M46 28 l6 -12 l7 12 z" />
      <path [attr.class]="look.plateClass" d="M61 28 l7 -12 l6 12 z" />
    }

    <ellipse class="art__shape" cx="60" cy="47" [attr.rx]="look.headRx" [attr.ry]="look.headRy" />

    <ellipse class="art__soft" cx="60" cy="59" rx="17" ry="10" />
    <circle class="art__pupil" cx="54" cy="56" r="1.8" />
    <circle class="art__pupil" cx="66" cy="56" r="1.8" />
    <path class="art__line" d="M50 62 Q60 68 70 62" stroke-width="2.5" />

    @if (look.hasTeeth) {
      <path class="art__glint" d="M55 63 l4 0 l-2 4 z" />
      <path class="art__glint" d="M62 63 l4 0 l-2 4 z" />
    }

    <circle class="art__eye-white" cx="51" cy="42" r="6.5" />
    <circle class="art__pupil" cx="52" cy="43" r="3.2" />
    <circle class="art__glint" cx="49.8" cy="40.2" r="1.7" />

    <circle class="art__eye-white" cx="69" cy="42" r="6.5" />
    <circle class="art__pupil" cx="70" cy="43" r="3.2" />
    <circle class="art__glint" cx="67.8" cy="40.2" r="1.7" />
  </g>
</svg>
