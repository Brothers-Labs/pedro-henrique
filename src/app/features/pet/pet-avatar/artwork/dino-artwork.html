@let look = traits();

<svg viewBox="0 0 120 120" class="art" aria-hidden="true" focusable="false">
  @if (look.hasAura) {
    <circle class="art__aura" cx="60" cy="62" r="54" />
    <path class="art__sparkle" d="M100 30 l3 7 l7 3 l-7 3 l-3 7 l-3 -7 l-7 -3 l7 -3 z" />
    <path class="art__sparkle" d="M14 84 l2.5 6 l6 2.5 l-6 2.5 l-2.5 6 l-2.5 -6 l-6 -2.5 l6 -2.5 z" />
  }

  <ellipse class="art__shadow" cx="60" cy="112" rx="26" ry="5" />

  <g [attr.transform]="scaleTransform()">
    <path class="art__line" [attr.d]="look.tail" stroke-width="11" />

    @if (look.hasPlates) {
      <path [attr.class]="look.plateClass" d="M52 60 l6 -12 l7 11 z" />
      <path [attr.class]="look.plateClass" d="M66 60 l8 -10 l6 12 z" />
      <path [attr.class]="look.plateClass" d="M80 66 l9 -6 l3 11 z" />
    }

    <ellipse class="art__shape" cx="50" cy="100" rx="11" ry="8" />
    <ellipse class="art__shape" cx="72" cy="100" rx="11" ry="8" />

    <ellipse class="art__shape" cx="60" cy="80" [attr.rx]="look.bodyRx" ry="21" />
    <ellipse class="art__soft" cx="58" cy="86" rx="14" ry="12" />

    @if (look.hasArms) {
      <path class="art__line" d="M42 74 q-8 2 -9 8" stroke-width="6" />
    }

    <path class="art__line" d="M42 62 Q34 58 32 50" stroke-width="14" />

    <ellipse class="art__shape" cx="34" cy="44" [attr.rx]="look.headRx" [attr.ry]="look.headRy" />
    <ellipse class="art__soft" cx="24" cy="48" rx="10" ry="7" />
    <circle class="art__pupil" cx="20" cy="46" r="1.8" />
    <path class="art__line" d="M17 52 Q23 55 29 52" stroke-width="2.5" />

    <circle class="art__eye-white" cx="34" cy="40" r="6" />
    <circle class="art__pupil" cx="32.5" cy="40.5" r="3" />
    <circle class="art__glint" cx="31" cy="38.5" r="1.6" />

    @if (look.hasPlates) {
      <path class="art__line" d="M40 34 l5 -7 l4 7" stroke-width="2.5" />
    }
  </g>
</svg>
