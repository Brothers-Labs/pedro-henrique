<div class="map">
  <ol class="map__path" aria-label="Mapa das fases da trilha">
    @for (step of steps(); track step.stage.id) {
      <li class="map__stop" [class.map__stop--linked]="!$last">
        <button
          type="button"
          class="island"
          [attr.data-tier]="step.stage.tier"
          [class.island--current]="step.isCurrent && !isFinished()"
          [class.island--completed]="step.isCompleted"
          [class.island--locked]="!step.isUnlocked"
          [disabled]="!step.isUnlocked"
          [attr.aria-current]="step.isCurrent && !isFinished() ? 'step' : null"
          [attr.aria-label]="ariaLabelFor(step)"
          (click)="chooseStep(step)"
        >
          <span class="island__scene" aria-hidden="true">
            {{ step.isUnlocked ? step.stage.emoji : '🔒' }}
          </span>
          <span class="island__number" aria-hidden="true">{{ step.index + 1 }}</span>
          <span class="island__tier">{{ tierLabels[step.stage.tier] }}</span>
          <span class="island__stars" aria-hidden="true">
            @for (slot of starSlots; track slot) {
              <span class="island__star" [class.island__star--on]="step.stars >= slot">★</span>
            }
          </span>
        </button>
      </li>
    }

    <li class="map__stop map__stop--treasure">
      <span class="treasure" [class.treasure--open]="isFinished()" aria-hidden="true">
        {{ isFinished() ? '🏆' : '🎁' }}
      </span>
      <span class="treasure__label">Prêmio final</span>
    </li>
  </ol>
</div>
