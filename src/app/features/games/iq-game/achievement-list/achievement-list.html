<section class="badges" aria-labelledby="conquistas-titulo">
  <h4 id="conquistas-titulo" class="badges__title">Conquistas</h4>

  <ul class="badges__list">
    @for (item of items(); track item.achievement.id) {
      <li class="badge" [class.badge--unlocked]="item.isUnlocked">
        <span class="badge__emoji" aria-hidden="true">
          {{ item.isUnlocked ? item.achievement.emoji : '🔒' }}
        </span>

        <span class="badge__text">
          <strong class="badge__title">{{ item.achievement.title }}</strong>
          <small class="badge__description">{{ item.achievement.description }}</small>
        </span>

        <span class="badge__state">
          @if (item.isNew) {
            <span class="badge__new">Nova!</span>
          } @else {
            {{ item.isUnlocked ? 'Conquistada' : 'A conquistar' }}
          }
        </span>
      </li>
    }
  </ul>
</section>
