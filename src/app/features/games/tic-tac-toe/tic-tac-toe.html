<section class="velha" aria-labelledby="velha-titulo">
  <header class="velha__header">
    <h3 id="velha-titulo" class="velha__title">Jogo da velha</h3>
    <p class="velha__subtitle">
      Você é o ❌ e joga primeiro. {{ skillLabel() }} — empatar também vale ponto.
    </p>
  </header>

  <app-game-hud [gameId]="gameId" />

  <p class="velha__status" role="status" aria-live="polite">{{ statusMessage() }}</p>

  <div class="velha__board" role="grid" aria-label="Tabuleiro do jogo da velha">
    @for (cell of board(); track $index) {
      <button
        type="button"
        class="velha__cell"
        [class.velha__cell--winning]="isWinningCell($index)"
        [disabled]="cell !== null || isFinished() || isComputerThinking()"
        [attr.aria-label]="cellLabel($index)"
        (click)="play($index)"
      >
        <span aria-hidden="true">{{ cell }}</span>
      </button>
    }
  </div>

  @if (isFinished() && earnedPoints() > 0) {
    <p class="velha__points" role="status">
      +{{ earnedPoints() }} <span aria-hidden="true">⭐</span>
    </p>
  }

  <button type="button" class="button button--secondary button--block" (click)="restart()">
    <span aria-hidden="true">🔄</span>
    {{ isFinished() ? 'Próxima partida' : 'Recomeçar a partida' }}
  </button>
</section>

<app-level-up-celebration [data]="celebration()" (continued)="continueAfterCelebration()" />
