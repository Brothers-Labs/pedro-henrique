<app-craft-page-frame backLink="/jogos" backLabel="Jogos">

      <span class="logo__top">PEDRO</span>
      <span class="logo__bottom">CRAFT</span>
    </h1>
    <p class="home__tagline">Colha, construa e cuide da sua fazenda!</p>

    <a class="home__play" data-tone="green" routerLink="jogar/fazenda">
      <span aria-hidden="true">▶</span> Explorar a fazenda

    <article class="notice">
      <p class="notice__emoji" aria-hidden="true">🧱</p>

  </section>
