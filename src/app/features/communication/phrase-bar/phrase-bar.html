<section class="phrase" aria-labelledby="titulo-da-frase">
  <h2 id="titulo-da-frase" class="phrase__title">
    <span aria-hidden="true">💬</span>
    {{ texts().title }}
  </h2>

  <div class="phrase__strip">
    @for (card of cards(); track $index) {
      <button
        type="button"
        class="phrase__chip"
        [attr.aria-label]="texts().removeCard(card.label)"
        (click)="cardRemoved.emit($index)"
      >
        <span aria-hidden="true">{{ card.emoji }}</span>
        {{ card.label }}
        <span class="phrase__chip-remove" aria-hidden="true">✕</span>
      </button>
    } @empty {
      <p class="phrase__placeholder">{{ texts().placeholder }}</p>
    }
  </div>

  <p class="phrase__preview" aria-live="polite">{{ text() }}</p>

  <div class="phrase__actions">
    <button
      type="button"
      class="button button--primary"
      [disabled]="!cards().length"
      (click)="speakRequested.emit()"
    >
      <span aria-hidden="true">{{ isSpeaking() ? '🔈' : '🔊' }}</span>
      {{ texts().speak }}
    </button>

    <button
      type="button"
      class="button button--small"
      [disabled]="!cards().length"
      (click)="lastRemoved.emit()"
    >
      <span aria-hidden="true">⬅️</span>
      {{ texts().undo }}
    </button>

    <button
      type="button"
      class="button button--small"
      [disabled]="!cards().length"
      (click)="clearRequested.emit()"
    >
      <span aria-hidden="true">🧹</span>
      {{ texts().clear }}
    </button>

    <button
      type="button"
      class="button button--small"
      [disabled]="!canSave()"
      (click)="saveRequested.emit()"
    >
      <span aria-hidden="true">⭐</span>
      {{ texts().save }}
    </button>
  </div>
</section>
