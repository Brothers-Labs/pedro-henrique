<div class="gallery container">
  <span #topSentinel class="gallery__anchor" tabindex="-1" aria-hidden="true"></span>

  <app-page-intro
    emoji="📸"
    title="Meu álbum"
    subtitle="Toque em qualquer foto para ver em tela cheia."
    color="purple"
  />

  <p class="gallery__count">
    <span aria-hidden="true">📸</span>
    {{ photoCount }} momentos registrados
  </p>

  @if (featuredPhotos.length) {
    <section class="gallery__section" aria-labelledby="destaques-titulo">
      <app-section-heading
        emoji="✨"
        eyebrow="Para começar"
        title="Momentos especiais"
        subtitle="As fotos de abertura do álbum, em tamanho grande."
        titleId="destaques-titulo"
        [isCentered]="false"
      />

      <app-featured-moments [photos]="featuredPhotos" (photoOpened)="openPhoto($event)" />
    </section>
  }

  <section class="gallery__section" aria-labelledby="mosaico-titulo">
    <app-section-heading
      emoji="📸"
      eyebrow="O álbum inteiro"
      title="Todas as aventuras"
      subtitle="Role para baixo e escolha a foto que você quiser ver de perto."
      titleId="mosaico-titulo"
      [isCentered]="false"
    />

    <app-gallery-grid [photos]="mosaicPhotos" (photoOpened)="openPhoto($event)" />
  </section>
</div>

<app-gallery-lightbox [photos]="photos" [(index)]="openPhotoIndex" />

<button
  type="button"
  class="to-top"
  [class.to-top--visible]="isAwayFromTop()"
  [attr.tabindex]="isAwayFromTop() ? null : -1"
  [attr.aria-hidden]="isAwayFromTop() ? null : true"
  aria-label="Voltar ao topo da página"
  (click)="scrollToTop()"
>
  <span aria-hidden="true">↑</span>
</button>
