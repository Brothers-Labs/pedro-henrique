<header class="header">
  <div class="header__inner">
    <button
      type="button"
      class="menu-button"
      [class.menu-button--open]="sideNav.isDrawerOpen()"
      [attr.aria-expanded]="sideNav.isExpanded()"
      [attr.aria-controls]="sideNavId"
      [attr.aria-haspopup]="sideNav.isDocked() ? null : 'dialog'"
      (click)="sideNav.toggle()"
    >
      <span class="menu-button__lines" aria-hidden="true">
        <span></span>
        <span></span>
        <span></span>
      </span>
      <span class="visually-hidden">{{ menuButtonLabel() }}</span>
    </button>

    <a class="brand" routerLink="/">
      <span class="brand__badge">
        <!-- Decorativa: o nome do Pedro Henrique já é o texto deste link. -->
        <img
          class="brand__photo"
          [src]="profile.photo.src"
          [width]="profile.photo.width"
          [height]="profile.photo.height"
          alt=""
          fetchpriority="high"
          decoding="async"
        />
      </span>
      <span class="brand__text">
        <strong class="brand__name">{{ profile.firstName }}</strong>
        <small class="brand__role">{{ age }} anos de aventuras</small>
      </span>
    </a>

    <app-calm-mode-toggle />
  </div>
</header>
