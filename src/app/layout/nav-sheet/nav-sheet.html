<dialog
  #dialog
  class="sheet"
  aria-label="Todos os lugares do site"
  (close)="handleNativeClose()"
  (click)="handleBackdropClick($event)"
>
  <div class="sheet__panel">
    <div
      class="sheet__grab"
      (touchstart)="startDrag($event)"
      (touchend)="finishDrag($event)"
    >
      <span class="sheet__handle" aria-hidden="true"></span>
    </div>

    <div class="sheet__bar">
      <h2 class="sheet__title">Para onde vamos?</h2>
      <button type="button" class="sheet__close" aria-label="Fechar o menu" (click)="close()">
        <span aria-hidden="true">✕</span>
      </button>
    </div>

    <ul class="sheet__list">
      @for (section of sections; track section.id) {
        <li>
          <a
            class="sheet__link"
            [attr.data-color]="section.color"
            [routerLink]="section.route"
            routerLinkActive="sheet__link--active"
            [routerLinkActiveOptions]="{ exact: section.route === '/' }"
            ariaCurrentWhenActive="page"
            (click)="close()"
          >
            <span class="sheet__emoji" aria-hidden="true">{{ section.emoji }}</span>
            <span class="sheet__text">
              <span class="sheet__label">{{ section.label }}</span>
              <span class="sheet__description">{{ section.description }}</span>
            </span>
          </a>
        </li>
      }
    </ul>

    <div class="sheet__footer">
      <app-calm-mode-toggle />
    </div>
  </div>
</dialog>
