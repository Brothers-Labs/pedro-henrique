<!doctype html>
<html lang="pt-BR">

<head>
  <meta charset="utf-8">
  <title>Pedro Henrique · O site mais divertido da internet</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description"
    content="O cantinho do Pedro Henrique: galeria de fotos, história, família, ideias malucas, jogos para brincar e vídeos.">
  <meta name="theme-color" content="#ff5da2">
  <meta name="color-scheme" content="light">

  <meta property="og:type" content="website">
  <meta property="og:title" content="Pedro Henrique · O site mais divertido da internet">
  <meta property="og:description"
    content="Galeria, história, família, ideias, jogos e vídeos do Pedro Henrique.">
  <meta property="og:locale" content="pt_BR">
  <meta name="twitter:card" content="summary">

  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-title" content="Pedro">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">

  <!--
    O modo calmo precisa valer antes da primeira pintura: as páginas chegam
    prontas do build e, sem isto, quem precisa de menos movimento veria as
    animações começarem até o Angular assumir. Espelha o CalmModeService.
  -->
  <script>
    try {
      var calmPreference = localStorage.getItem('pedro-henrique:calm-mode');
      var prefersCalm = calmPreference === 'on' ||
        (calmPreference === null && matchMedia('(prefers-reduced-motion: reduce)').matches);
      if (prefersCalm) document.documentElement.setAttribute('data-calm', 'on');
    } catch (error) {
      // Storage bloqueado: o CalmModeService decide assim que o app iniciar.
    }
  </script>
  <!-- O retrato do header aparece em todas as páginas: vale antecipar o download. -->
  <link rel="preload" as="image" type="image/jpeg" href="img/pedroheaderperfl.jpe" fetchpriority="high">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:wght@400;600;700;800&display=swap"
    rel="stylesheet">
</head>

<body>
  <app-root>
    <div class="app-boot" role="status" aria-live="polite">Carregando a diversão…</div>
  </app-root>
</body>

</html>
